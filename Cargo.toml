[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]
# Spikes keep their own lockfiles and toolchains.
exclude = ["root-broker"]
# Host builds: the EFL binaries only link against the TV sysroot (see
# cross-build.sh), so plain `cargo build` skips them.
default-members = [
    "crates/tv-proto",
    "crates/tv-sdb",
    "bins/tv-authd",
    "bins/tv-auth-cli",
    "bins/tv-sdb",
    "bins/tv-pkg",
]

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tv-proto = { path = "crates/tv-proto" }
tv-efl = { path = "crates/tv-efl" }
tv-tizen = { path = "crates/tv-tizen" }
tv-sdb = { path = "crates/tv-sdb" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
