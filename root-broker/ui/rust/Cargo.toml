[package]
name = "tv-auth-ui"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "tv-auth-ui"
path = "src/main.rs"
# The binary links the TV's ARM EFL libraries; only the library's pure helpers
# are host-testable.
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
